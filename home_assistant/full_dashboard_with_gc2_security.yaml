                        icon:
                          - width: clamp(14px, 4.5vw, 20px)
                          - height: clamp(14px, 4.5vw, 20px)
                          - color: |
                              [[[
                                const r = parseFloat(states['sensor.soil_moisture_rssi_front_yard']?.state);
                                if (isNaN(r)) return 'var(--secondary-text-color)';
                                if (r > -70) return 'var(--success-color)';
                                if (r > -85) return 'var(--warning-color)';
                                return 'var(--error-color)';

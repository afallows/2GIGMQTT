                  options:
                    name: Trouble count
                    secondary_info: last-changed
                - integration: gc2_panel
                  name: "/UART baud$/"
                  options:
                    name: UART baud
                    secondary_info: last-changed
                - integration: gc2_panel
                  name: "/Unacknowledged troubles$/"
                  options:
                    name: Unacknowledged troubles
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/AC power loss$/"
                  options:
                    name: AC power loss
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Communication failure$/"
                  options:
                    name: Communication failure
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Latched alarm memory$/"
                  options:
                    name: Latched alarm memory
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Panel reset required$/"
                  options:
                    name: Panel reset required
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Panel tamper$/"
                  options:
                    name: Panel tamper
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Panel trouble$/"
                  options:
                    name: Panel trouble
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/RF jamming$/"
                  options:
                    name: RF jamming
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/Siren tamper$/"
                  options:
                    name: Siren tamper
                    secondary_info: last-changed
            unique: true
            sort:
              method: name
              ignore_case: true

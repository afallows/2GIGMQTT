            custom_fields:
              state_badge: |
                [[[
                  const state = states['sensor.maytag_washer_state']?.state || 'unknown';
                  const badgeEntity = 'sensor.maytag_washer_state';
                  const fault = states['sensor.maytag_washer_active_fault']?.state || 'none';

                  function pretty(v) {
                    if (!v || v === 'unknown' || v === 'unavailable') return 'Unknown';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  let text = pretty(state);
                  let color = '#777';

                  if (fault && fault !== 'none' && fault !== 'unknown' && fault !== 'unavailable') {
                    text = 'Fault';
                    color = '#ff5252';
                  } else if (state === 'running') {
                    text = 'Running';
                    color = '#00c853';
                  } else if (state === 'paused') {
                    text = 'Paused';
                    color = '#ffc107';
                  } else if (state === 'standby' || state === 'programming' || state === 'idle') {
                    text = 'Ready';
                    color = '#00c853';
                  } else if (state === 'unavailable') {
                    text = 'Offline';
                    color = '#777';
                  }

                  return `
                    <div class="state-badge" onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${badgeEntity}'}}));" style="cursor:pointer;">
                      <span>${text}</span>
                      <span class="state-dot" style="background:${color};"></span>
                    </div>
                  `;
                ]]]
              remote: |
                [[[
                  const remoteEntity = 'binary_sensor.maytag_washer_remote_start_enabled';
                  const wrap = (t) => `<span onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${remoteEntity}'}}));" style="cursor:pointer;">${t}</span>`;
                  const rs = states['binary_sensor.maytag_washer_remote_start_enabled']?.state;
                  if (rs === 'on') return wrap('Remote start: <span style="color:#00c853;font-weight:900;">ON</span>');
                  if (rs === 'off') return wrap('Remote start: <span style="color:#ff5252;font-weight:900;">OFF</span>');
                  return wrap('Remote start: <span style="color:#888;font-weight:900;">Unknown</span>');
                ]]]
              left_panel: |
                [[[
                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }

                  function pretty(v) {
                    if (!v || v === '—') return '—';
                    if (v === 'on') return 'On';
                    if (v === 'off') return 'Off';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  function row(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="metric"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                        <div class="metric-text">
                          <div class="metric-label">${label}</div>
                          <div class="metric-value">${value}</div>
                        </div>
                      </div>
                    `;
                  }

                  const E = {
                    'Door': 'binary_sensor.maytag_washer_door',
                    'Door lock': 'sensor.maytag_washer_door_locked',
                    'Controls': 'sensor.maytag_washer_control_lockout',
                    'Fault': 'sensor.maytag_washer_active_fault',
                    'Cloud': 'sensor.maytag_washer_last_cloud_response'
                  };
                  const doorRaw = raw('binary_sensor.maytag_washer_door');
                  const doorText = doorRaw === 'on' ? 'Open' : doorRaw === 'off' ? 'Closed' : pretty(doorRaw);
                  const doorClosed = doorText.toLowerCase() === 'closed';

                  const doorLockedRaw = raw('sensor.maytag_washer_door_locked');
                  const doorLockedText = pretty(doorLockedRaw);
                  const isDoorLocked = doorLockedText.toLowerCase().includes('locked') && !doorLockedText.toLowerCase().includes('unlocked');

                  const controlRaw = raw('sensor.maytag_washer_control_lockout');
                  const controlText = pretty(controlRaw);
                  const controlsLocked = controlText.toLowerCase().includes('locked');

                  const faultRaw = raw('sensor.maytag_washer_active_fault');
                  const faultText = pretty(faultRaw);
                  const faultOk = faultRaw === 'none' || faultRaw === '—';

                  const cloudRaw = raw('sensor.maytag_washer_last_cloud_response');
                  const cloudText = pretty(cloudRaw);
                  const cloudOk = cloudText.toLowerCase() === 'accepted';

                  return `
                    ${row(doorClosed ? 'mdi:door-closed' : 'mdi:door-open', 'Door', doorText, doorClosed ? '#20c997' : '#ff5252')}
                    ${row(isDoorLocked ? 'mdi:lock' : 'mdi:lock-open-variant', 'Door lock', doorLockedText, isDoorLocked ? '#4dabf7' : '#888')}
                    ${row(controlsLocked ? 'mdi:lock-check' : 'mdi:lock-open-check', 'Controls', controlText, controlsLocked ? '#4dabf7' : '#888')}
                    ${row(faultOk ? 'mdi:shield-check' : 'mdi:alert-circle', 'Fault', faultText, faultOk ? '#20c997' : '#ff5252')}
                    ${row(cloudOk ? 'mdi:cloud-check' : 'mdi:cloud-alert', 'Cloud', cloudText, cloudOk ? '#20c997' : '#ffc107')}
                  `;
                ]]]
              right_panel: |
                [[[
                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }

                  function pretty(v) {
                    if (!v || v === '—') return '—';
                    if (v === 'on') return 'On';
                    if (v === 'off') return 'Off';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  function row(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="metric metric-right"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <div class="metric-text metric-text-right">
                          <div class="metric-label">${label}</div>
                          <div class="metric-value">${value}</div>
                        </div>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                      </div>
                    `;
                  }

                  const E = {
                    'Temp': 'sensor.maytag_washer_wash_temperature',
                    'Soil': 'sensor.maytag_washer_soil_level',
                    'Spin': 'sensor.maytag_washer_spin_speed',
                    'Extra rinse': 'sensor.maytag_washer_extra_rinse',
                    'Extra power': 'sensor.maytag_washer_extra_power'
                  };
                  const temp = pretty(raw('sensor.maytag_washer_wash_temperature'));
                  const soil = pretty(raw('sensor.maytag_washer_soil_level'));
                  const spin = pretty(raw('sensor.maytag_washer_spin_speed'));
                  const rinse = pretty(raw('sensor.maytag_washer_extra_rinse'));
                  const power = pretty(raw('sensor.maytag_washer_extra_power'));

                  return `
                    ${row('mdi:thermometer', 'Temp', temp, '#ff922b')}
                    ${row('mdi:shovel', 'Soil', soil, '#a1887f')}
                    ${row('mdi:rotate-right', 'Spin', spin, '#4dabf7')}
                    ${row('mdi:water-plus', 'Extra rinse', rinse, rinse === 'On' ? '#4dabf7' : '#888')}
                    ${row('mdi:flash', 'Extra power', power, power === 'On' ? '#ffc107' : '#888')}
                  `;
                ]]]
              cycle: |
                [[[
                  function pretty(v) {
                    if (!v || v === 'unknown' || v === 'unavailable') return '—';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  const cycle = states['sensor.maytag_washer_cycle']?.state || '—';
                  const cycleEntity = 'sensor.maytag_washer_cycle';
                  const phase = states['sensor.maytag_washer_phase']?.state || '';
                  const cycleText = pretty(cycle);
                  const phaseText = pretty(phase);

                  if (phase && phase !== 'unknown' && phase !== 'unavailable') {
                    return `<div onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${cycleEntity}'}}));" style="cursor:pointer;">${cycleText}<br><span>${phaseText}</span></div>`;
                  }

                  return `<div onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${cycleEntity}'}}));" style="cursor:pointer;">${cycleText}</div>`;
                ]]]
              remaining: |
                [[[
                  const remEntity = 'sensor.maytag_washer_time_complete';
                  const wrap = (t) => `<div onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${remEntity}'}}));" style="cursor:pointer;">${t}</div>`;

                  function parseFinish(v) {
                    if (!v || v === 'unknown' || v === 'unavailable' || v === '') return null;
                    const n = Number(v);
                    if (!isNaN(n)) {
                      // epoch in seconds or milliseconds
                      return new Date(n < 1e12 ? n * 1000 : n);
                    }
                    const d = new Date(v);
                    return isNaN(d.getTime()) ? null : d;
                  }

                  const state = states['sensor.maytag_washer_state']?.state;
                  if (state === 'standby' || state === 'programming' || state === 'idle') return wrap('Ready');

                  const finish = parseFinish(states['sensor.maytag_washer_time_complete']?.state);
                  if (!finish) return wrap('—');

                  let mins = Math.round((finish.getTime() - Date.now()) / 60000);
                  if (mins < 0) mins = 0;

                  const h = Math.floor(mins / 60);
                  const m = mins % 60;

                  if (h <= 0) return wrap(`${m} min`);
                  return wrap(`${h}:${String(m).padStart(2, '0')}`);
                ]]]
              chips: |
                [[[
                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }

                  function pretty(v) {
                    if (!v || v === '—') return '—';
                    if (v === 'on') return 'On';
                    if (v === 'off') return 'Off';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  function chip(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="chip"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                        <span class="chip-label">${label}</span>
                        <span class="chip-value">${value}</span>
                      </div>
                    `;
                  }

                  const E = {
                    'Steam': 'sensor.maytag_washer_steam',
                    'Post care': 'sensor.maytag_washer_post_care',
                    'Pets': 'sensor.maytag_washer_pets',
                    'Finish': 'sensor.maytag_washer_time_complete',
                    'Cycle state': 'sensor.maytag_washer_cycle_time_state'
                  };
                  const steam = pretty(raw('sensor.maytag_washer_steam'));
                  const postCare = pretty(raw('sensor.maytag_washer_post_care'));
                  const pets = pretty(raw('sensor.maytag_washer_pets'));
                  const timeComplete = pretty(raw('sensor.maytag_washer_time_complete'));
                  const cycleState = pretty(raw('sensor.maytag_washer_cycle_time_state'));

                  return `
                    ${chip('mdi:water', 'Steam', steam, steam === 'On' ? '#4dabf7' : '#777')}
                    ${chip('mdi:tshirt-crew', 'Post care', postCare, postCare === 'On' ? '#20c997' : '#777')}
                    ${chip('mdi:paw', 'Pets', pets, pets === 'On' ? '#c084fc' : '#777')}
                    ${chip('mdi:clock-check-outline', 'Finish', timeComplete, '#4dabf7')}
                    ${chip('mdi:progress-clock', 'Cycle state', cycleState, '#777')}
                  `;
                ]]]
            styles:
              card:
                - padding: 12px
                - border-radius: 18px
                - min-height: 405px
                - overflow: hidden
                - box-sizing: border-box
              grid:
                - grid-template-areas: |
                    "n n state_badge"
                    "remote remote remote"
                    "left_panel i right_panel"
                    "cycle cycle cycle"
                    "remaining remaining remaining"
                    "chips chips chips"
                - grid-template-columns: minmax(72px, 1fr) 108px minmax(72px, 1fr)
                - grid-template-rows: auto auto 1fr auto auto auto
                - column-gap: 6px
                - row-gap: 5px
              name:
                - justify-self: start
                - align-self: center
                - font-size: 28px
                - font-weight: 900
                - color: rgba(150,150,150,.75)
                - letter-spacing: -1px
              icon:
                - width: 56px
                - height: 56px
                - color: '#30384d'
                - background: white
                - border-radius: 50%

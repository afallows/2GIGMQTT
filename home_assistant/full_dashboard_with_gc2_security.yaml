    title: Swim Lessons
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## 🏊 Available Swim Lessons

              _Last checked: {{ state_attr('sensor.swim_lessons_available',
              'last_checked') | default('unknown', true) }}_

              {% set lessons = state_attr('sensor.swim_lessons_available',
              'lessons') or [] %}

              {% if lessons %}

              {% for l in lessons %}

              ### {{ l.level }}

              {{ l.date_range }} — {{ l.schedule }}

              [➡️ Enroll]({{ l.enroll_url }})

              {% endfor %}

              {% else %}

              No lessons currently available.

              {% endif %}
        column_span: 1
      - type: grid
        cards:
          - type: markdown
            content: >-
              ## 🎟️ NPCC Tickets


              _Currently on sale: {{ states('sensor.npcc_tickets_on_sale') }}_  

              _Last checked: {{ state_attr('sensor.npcc_tickets_on_sale',
              'last_checked') | default('unknown', true) }}_


              {% set events = state_attr('sensor.npcc_tickets_on_sale',
              'events_on_sale') or [] %}


              {% if events %}

              {% for e in events %}

              ### {{ e.name }}


              {% if e.first_instance_display %}

              {{ e.first_instance_display }}

              {% elif e.instance_dates %}

              {{ e.instance_dates }}

              {% endif %}


              {% if e.event_type or e.genre %}

              _{{ e.event_type }}{% if e.event_type and e.genre %} / {% endif
              %}{{ e.genre }}_

              {% endif %}


              [➡️ View / Buy Tickets]({{ e.url or e.purchase_url }})


              {% endfor %}

              {% else %}

              No NPCC tickets currently on sale.

              {% endif %}
        column_span: 1
    icon: mdi:swim

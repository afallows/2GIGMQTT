      - type: vertical-stack
        title: Dishwasher
        cards:
          - type: custom:button-card
            entity: sensor.104120531161003244_bsh_common_status_operationstate
            icon: mdi:dishwasher
            name: DISHWASHER
            show_icon: true
            show_name: true
            show_state: false
            custom_fields:
              state_badge: |
                [[[
                  const ID = '104120531161003244';
                  const opEntity = 'sensor.' + ID + '_bsh_common_status_operationstate';

                  function clean(v) {
                    if (!v || v === 'unknown' || v === 'unavailable') return '';
                    return String(v).replace(/^BSH\..*\./, '');
                  }
                  function pretty(v) {
                    if (!v) return 'Unknown';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  const op = clean(states[opEntity]?.state);
                  let text = pretty(op), color = '#777';

                  switch (op) {
                    case 'Run':          text = 'Running';  color = '#00c853'; break;
                    case 'Ready':        text = 'Ready';    color = '#00c853'; break;
                    case 'DelayedStart': text = 'Delayed';  color = '#ffc107'; break;
                    case 'Pause':        text = 'Paused';   color = '#ffc107'; break;
                    case 'ActionRequired': text = 'Action'; color = '#ffc107'; break;
                    case 'Finished':     text = 'Finished'; color = '#4dabf7'; break;
                    case 'Aborting':     text = 'Stopping'; color = '#ff5252'; break;
                    case 'Error':        text = 'Error';    color = '#ff5252'; break;
                    case 'Inactive':
                    case 'Off':          text = 'Off';      color = '#777';    break;
                    case '':             text = 'Unknown';  color = '#777';    break;
                  }

                  return `
                    <div class="state-badge" onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${opEntity}'}}));" style="cursor:pointer;">
                      <span>${text}</span>
                      <span class="state-dot" style="background:${color};"></span>
                    </div>
                  `;
                ]]]
              remote: |
                [[[
                  const ID = '104120531161003244';
                  const remoteEntity = 'binary_sensor.' + ID + '_bsh_common_status_remotecontrolstartallowed';
                  const wrap = (t) => `<span onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${remoteEntity}'}}));" style="cursor:pointer;">${t}</span>`;
                  const rs = states[remoteEntity]?.state;
                  if (rs === 'on') return wrap('Remote start: <span style="color:#00c853;font-weight:900;">ON</span>');
                  if (rs === 'off') return wrap('Remote start: <span style="color:#ff5252;font-weight:900;">OFF</span>');
                  return wrap('Remote start: <span style="color:#888;font-weight:900;">Unknown</span>');
                ]]]
              left_panel: |
                [[[
                  const ID = '104120531161003244';

                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }
                  function enumv(v) {
                    return v === '—' ? '—' : String(v).replace(/^BSH\..*\./, '');
                  }
                  function pretty(v) {
                    if (!v || v === '—') return '—';
                    if (v === 'on') return 'On';
                    if (v === 'off') return 'Off';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }
                  function row(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="metric"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                        <div class="metric-text">
                          <div class="metric-label">${label}</div>
                          <div class="metric-value">${value}</div>
                        </div>
                      </div>
                    `;
                  }

                  const E = {
                    'Door': 'binary_sensor.' + ID + '_bsh_common_status_doorstate',
                    'Power': 'sensor.' + ID + '_bsh_common_setting_powerstate',
                    'Remote': 'binary_sensor.' + ID + '_bsh_common_status_remotecontrolactive',
                    'Connection': 'binary_sensor.' + ID + '_connected'
                  };

                  const doorState = raw(E['Door']);          // door device_class: on=Open, off=Closed
                  const doorClosed = doorState === 'off';
                  const doorText = doorState === 'on' ? 'Open' : doorState === 'off' ? 'Closed' : '—';

                  const powerRaw = enumv(raw(E['Power']));
                  const powerOn = powerRaw.toLowerCase() === 'on';

                  const remoteRaw = raw(E['Remote']);
                  const remoteOn = remoteRaw === 'on';

                  const connRaw = raw(E['Connection']);
                  const connOk = connRaw === 'on' || String(connRaw).toLowerCase() === 'connected';

                  return `
                    ${row(doorClosed ? 'mdi:door-closed' : 'mdi:door-open', 'Door', doorText, doorClosed ? '#20c997' : '#ff5252')}
                    ${row(powerOn ? 'mdi:power' : 'mdi:power-off', 'Power', powerOn ? 'On' : pretty(powerRaw), powerOn ? '#20c997' : '#888')}
                    ${row(remoteOn ? 'mdi:cellphone-check' : 'mdi:cellphone-off', 'Remote', remoteOn ? 'On' : 'Off', remoteOn ? '#4dabf7' : '#888')}
                    ${row(connOk ? 'mdi:cloud-check' : 'mdi:cloud-alert', 'Connection', connOk ? 'Connected' : pretty(connRaw), connOk ? '#20c997' : '#ffc107')}
                  `;
                ]]]
              right_panel: |
                [[[
                  const ID = '104120531161003244';

                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }
                  function pretty(v) {
                    if (!v || v === '—') return '—';
                    if (v === 'on') return 'On';
                    if (v === 'off') return 'Off';
                    return String(v)
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }
                  function pct(v) {
                    if (v === '—') return '—';
                    return String(v).includes('%') ? v : v + '%';
                  }
                  function row(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="metric metric-right"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <div class="metric-text metric-text-right">
                          <div class="metric-label">${label}</div>
                          <div class="metric-value">${value}</div>
                        </div>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                      </div>
                    `;
                  }

                  const E = {
                    'Energy': 'sensor.' + ID + '_bsh_common_option_energyforecast',
                    'Water': 'sensor.' + ID + '_bsh_common_option_waterforecast',
                    'Half load': 'switch.' + ID + '_dishcare_dishwasher_option_halfload',
                    'Sanitize': 'switch.' + ID + '_dishcare_dishwasher_option_hygieneplus'
                  };

                  const energy = raw(E['Energy']);
                  const water = raw(E['Water']);
                  const half = raw(E['Half load']);
                  const san = raw(E['Sanitize']);

                  return `
                    ${row('mdi:lightning-bolt', 'Energy', pct(energy), '#ff922b')}
                    ${row('mdi:water', 'Water', pct(water), '#4dabf7')}
                    ${row(half === 'on' ? 'mdi:circle-half-full' : 'mdi:circle-outline', 'Half load', pretty(half), half === 'on' ? '#4dabf7' : '#888')}
                    ${row('mdi:shimmer', 'Sanitize', pretty(san), san === 'on' ? '#c084fc' : '#888')}
                  `;
                ]]]
              cycle: |
                [[[
                  const ID = '104120531161003244';
                  function pretty(v) {
                    if (!v || v === 'unknown' || v === 'unavailable') return '—';
                    return String(v)
                      .replace(/^.*\./, '')
                      .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
                      .replace(/^./, c => c.toUpperCase());
                  }

                  const cycleEntity = 'sensor.' + ID + '_active_program';
                  let name = states[cycleEntity]?.state;
                  if (!name || name === 'unknown' || name === 'unavailable') {
                    name = states['sensor.' + ID + '_selected_program']?.state;
                  }
                  const cycleText = pretty(name);

                  return `<div onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${cycleEntity}'}}));" style="cursor:pointer;">${cycleText}</div>`;
                ]]]
              remaining: |
                [[[
                  const ID = '104120531161003244';
                  const remEntity = 'sensor.' + ID + '_bsh_common_option_remainingprogramtime';
                  const wrap = (t) => `<div onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${remEntity}'}}));" style="cursor:pointer;">${t}</div>`;

                  const opRaw = states['sensor.' + ID + '_bsh_common_status_operationstate']?.state || '';
                  const op = String(opRaw).replace(/^BSH\..*\./, '');

                  if (op === 'Finished') return wrap('Done');
                  if (['Ready', 'Inactive', 'Off', ''].includes(op)) return wrap('Ready');

                  const raw = states[remEntity]?.state;
                  if (!raw || raw === 'unknown' || raw === 'unavailable') return wrap('—');

                  const est = states['binary_sensor.' + ID + '_bsh_common_option_remainingprogramtimeisestimated']?.state === 'on' ? '~' : '';

                  const finish = new Date(raw);
                  if (isNaN(finish.getTime())) return wrap(raw);

                  let mins = Math.round((finish.getTime() - Date.now()) / 60000);
                  if (mins < 0) mins = 0;

                  const h = Math.floor(mins / 60);
                  const m = mins % 60;

                  if (h <= 0) return wrap(`${est}${m} min`);
                  return wrap(`${est}${h}:${String(m).padStart(2, '0')}`);
                ]]]
              chips: |
                [[[
                  const ID = '104120531161003244';

                  function raw(id) {
                    const s = states[id]?.state;
                    return (!s || s === 'unknown' || s === 'unavailable') ? '—' : s;
                  }
                  function pct(v) {
                    if (v === '—') return '—';
                    return String(v).includes('%') ? v : v + '%';
                  }
                  function hhmm(id) {
                    const r = states[id]?.state;
                    if (!r || r === 'unknown' || r === 'unavailable') return '—';
                    const d = new Date(r);
                    if (isNaN(d.getTime())) return r;
                    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                  }
                  function chip(icon, label, value, color) {
                    const entityId = (typeof E !== 'undefined' && E[label]) ? E[label] : '';
                    return `
                      <div class="chip"${entityId ? ` onpointerdown="event.stopPropagation();" ontouchstart="event.stopPropagation();" onclick="event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${entityId}'}}));" style="cursor:pointer;"` : ''}>
                        <ha-icon icon="${icon}" style="color:${color};"></ha-icon>
                        <span class="chip-label">${label}</span>
                        <span class="chip-value">${value}</span>
                      </div>
                    `;
                  }

                  const E = {
                    'Progress': 'sensor.' + ID + '_bsh_common_option_programprogress',
                    'Start in': 'sensor.' + ID + '_bsh_common_option_startinrelative',
                    'Finish': 'sensor.' + ID + '_bsh_common_option_remainingprogramtime',
                    'Remote start': 'binary_sensor.' + ID + '_bsh_common_status_remotecontrolstartallowed'
                  };

                  const progress = pct(raw(E['Progress']));
                  const startIn = raw(E['Start in']);
                  const finish = hhmm(E['Finish']);
                  const remoteStart = raw(E['Remote start']);

                  return `
                    ${chip('mdi:progress-clock', 'Progress', progress, '#4dabf7')}
                    ${chip('mdi:timer-sand', 'Start in', startIn === '—' ? '—' : startIn, '#777')}
                    ${chip('mdi:clock-check-outline', 'Finish', finish, '#4dabf7')}
                    ${chip('mdi:cellphone-arrow-down', 'Remote start', remoteStart === 'on' ? 'On' : 'Off', remoteStart === 'on' ? '#00c853' : '#777')}
                  `;
                ]]]
            styles:
              card:
                - padding: 12px
                - border-radius: 18px
                - min-height: 405px
                - overflow: hidden
                - box-sizing: border-box
              grid:
                - grid-template-areas: |
                    "n n state_badge"
                    "remote remote remote"
                    "left_panel i right_panel"
                    "cycle cycle cycle"
                    "remaining remaining remaining"
                    "chips chips chips"
                - grid-template-columns: minmax(72px, 1fr) 108px minmax(72px, 1fr)
                - grid-template-rows: auto auto 1fr auto auto auto
                - column-gap: 6px
                - row-gap: 5px
              name:
                - justify-self: start
                - align-self: center
                - font-size: 28px
                - font-weight: 900
                - color: rgba(150,150,150,.75)
                - letter-spacing: -1px
              icon:
                - width: 56px
                - height: 56px
                - color: '#30384d'
                - background: white
                - border-radius: 50%
                - padding: 25px
                - box-shadow: 0 10px 24px rgba(0,0,0,.22)
              img_cell:
                - grid-area: i
                - justify-self: center
                - align-self: center
                - margin-top: 4px
                - margin-bottom: 4px
              custom_fields:
                state_badge:
                  - justify-self: end
                  - align-self: center
                remote:
                  - justify-self: start
                  - font-size: 13px
                  - font-weight: 700
                  - margin-top: -5px
                left_panel:
                  - justify-self: stretch
                  - align-self: center
                  - width: 100%
                  - min-width: 0
                right_panel:
                  - justify-self: stretch
                  - align-self: center
                  - width: 100%
                  - min-width: 0
                cycle:
                  - justify-self: center
                  - text-align: center
                  - font-size: 19px
                  - font-weight: 850
                  - margin-top: 4px
                  - line-height: 1.1
                remaining:
                  - justify-self: center
                  - font-size: 22px
                  - font-weight: 900
                  - color: var(--primary-color)
                  - margin-top: 0px
                chips:
                  - justify-self: center
                  - width: 100%
                  - margin-top: 8px
            extra_styles: >
              .metric, .chip, .state-badge, #cycle > div, #remaining > div,
              #remote span {
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
              }


              .metric:hover, .chip:hover {
                background: rgba(255,255,255,0.12);
              }


              .state-badge {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 21px;
                font-weight: 900;
                white-space: nowrap;
              }


              .state-dot {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                display: inline-block;
                flex: 0 0 26px;
              }


              .metric {
                display: grid;
                grid-template-columns: 18px minmax(0, 1fr);
                align-items: center;
                gap: 5px;
                min-height: 31px;
                margin: 4px 0;
                padding: 4px 5px;
                border-radius: 10px;
                background: rgba(255,255,255,0.055);
                box-sizing: border-box;
                max-width: 100%;
              }


              .metric-right {
                grid-template-columns: minmax(0, 1fr) 18px;
              }


              .metric ha-icon {
                width: 17px;
                height: 17px;
              }


              .metric-text {
                min-width: 0;
                overflow: hidden;
              }


              .metric-text-right {
                text-align: right;
              }


              .metric-label {
                font-size: 8.5px;
                opacity: 0.58;
                font-weight: 900;
                line-height: 1;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              }


              .metric-value {
                margin-top: 2px;
                font-size: 11.5px;
                font-weight: 900;
                line-height: 1.05;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              }


              #cycle span {
                font-size: 12px;
                opacity: .62;
                font-weight: 800;
              }


              #chips {
                display: flex;
                justify-content: center;
                gap: 5px;
                flex-wrap: wrap;
                max-width: 100%;
              }


              .chip {
                display: flex;
                align-items: center;
                gap: 3px;
                padding: 4px 6px;
                border-radius: 999px;
                background: rgba(255,255,255,0.06);
                font-size: 10px;
                font-weight: 800;
                max-width: 100%;
              }


              .chip ha-icon {
                width: 13px;
                height: 13px;
              }


              .chip-label {
                opacity: .62;
                text-transform: uppercase;
                font-size: 8px;
              }


              .chip-value {
                font-size: 10px;
                white-space: nowrap;
              }
          - type: horizontal-stack
            cards:

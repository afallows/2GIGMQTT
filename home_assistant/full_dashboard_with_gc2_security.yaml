                    card:
                      type: custom:button-card
                      entity: sensor.soil_moisture_battery_mv_front_yard
                      show_name: false
                      show_icon: true
                      show_state: true
                      tap_action:
                        action: more-info
                      icon: |
                        [[[
                          const raw = parseFloat(states['sensor.soil_moisture_battery_mv_front_yard']?.state);
                          const unit = states['sensor.soil_moisture_battery_mv_front_yard']?.attributes?.unit_of_measurement ?? 'mV';

                          let mv = NaN;
                          if (!isNaN(raw)) {
                            mv = unit.toLowerCase() === 'mv' || raw > 20 ? raw : raw * 1000;
                          }

                          const pct = isNaN(mv) ? 0 : Math.max(0, Math.min(100, ((mv - 1200) / (1600 - 1200)) * 100));

                          if (isNaN(mv)) return 'mdi:battery-unknown';
                          if (pct >= 95) return 'mdi:battery';
                          if (pct >= 80) return 'mdi:battery-80';
                          if (pct >= 60) return 'mdi:battery-60';
                          if (pct >= 40) return 'mdi:battery-40';
                          if (pct >= 20) return 'mdi:battery-20';
                          return 'mdi:battery-alert';
                        ]]]

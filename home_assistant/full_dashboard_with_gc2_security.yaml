                          const unit = states['sensor.soil_moisture_battery_mv_front_yard']?.attributes?.unit_of_measurement ?? 'mV';

                          let mv = NaN;
                          if (!isNaN(raw)) {
                            mv = unit.toLowerCase() === 'mv' || raw > 20 ? raw : raw * 1000;
                          }

                          if (isNaN(mv)) return '—';
                          return `${(mv / 1000).toFixed(2)}V`;
                        ]]]

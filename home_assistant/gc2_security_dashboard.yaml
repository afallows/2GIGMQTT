              type: entities
              show_header_toggle: false
              state_color: true
            filter:
              template: >
                {% set gc2 = integration_entities('gc2_panel') %}
                {% set presets = gc2
                  | select('match', '^select\\.')
                  | select('search', 'chime_and_announcement_volume_preset$')
                  | list %}
                {% set controls = presets if presets else gc2
                    | select('match', '^number\\.')
                    | select('search', 'chime_and_announcement_volume$')
                    | list %}
                {% set ns = namespace(rows=[]) %}
                {% for entity_id in controls %}
                  {% set ns.rows = ns.rows + [{
                    'entity': entity_id,
                    'name': 'Chime and announcement volume'
                  }] %}
                {% endfor %}
                {{ ns.rows }}
              include:
                - integration: gc2_panel
                  name: "/Backup battery$/"
                  options:
                    name: Backup battery
                    secondary_info: last-changed
                - integration: gc2_panel
                  name: "/Backup battery voltage$/"
                  options:
                    name: Backup battery voltage
                    secondary_info: last-changed
                - integration: gc2_panel
                  name: "/Command status$/"
                  options:
                    name: Command status
                    secondary_info: last-changed
                - integration: gc2_panel
                  name: "/Debug unlock$/"
                  options:
                    name: Debug unlock
                    secondary_info: last-changed
                - integration: gc2_panel

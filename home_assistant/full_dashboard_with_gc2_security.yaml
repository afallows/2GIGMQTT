                      tap_action:
                        action: more-info
                      state_display: |
                        [[[
                          const r = parseFloat(states['sensor.soil_moisture_rssi_front_yard']?.state);
                          const unit = states['sensor.soil_moisture_rssi_front_yard']?.attributes?.unit_of_measurement ?? 'dB';
                          if (isNaN(r)) return '—';
                          return `${Math.round(r)} ${unit}`;
                        ]]]
                      styles:
                        card:
                          - background: none
                          - box-shadow: none
                          - border: none
                          - padding: 0
                        grid:
                          - grid-template-areas: '"i" "s"'

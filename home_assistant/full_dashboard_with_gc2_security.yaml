  - title: Security
    path: security
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    dense_section_placement: true
    visible:
      # Preserved from the previous dashboard. Edit these in the visual editor
      # if another Home Assistant user should see this view.
      - user: 8af0b7aa61a94422959b3a5dea5a0085
      - user: 2e32d693479a4d3492352c4562497bf0
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Home security
            heading_style: title
            icon: mdi:shield-home
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - integration: gc2_panel
                  domain: alarm_control_panel
                  options:
                    type: custom:button-card
                    template: gc2_alarm_status
            sort:
              method: name
            show_empty: false
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - integration: gc2_panel
                  domain: alarm_control_panel
                  options:
                    type: horizontal-stack
                    cards:
                      - type: custom:button-card
                        entity: this.entity_id
                        template: gc2_alarm_action
                        variables:
                          name: Arm stay
                          subtitle: Secure the perimeter
                          icon: mdi:shield-home
                          color: var(--success-color)
                          service: alarm_control_panel.alarm_arm_home
                          confirmation: Arm the system in Stay mode?
                      - type: custom:button-card
                        entity: this.entity_id
                        template: gc2_alarm_action
                        variables:
                          name: Arm away
                          subtitle: Secure the entire home
                          icon: mdi:shield-lock
                          color: var(--primary-color)
                          service: alarm_control_panel.alarm_arm_away
                          confirmation: Arm the system in Away mode?
                      - type: custom:button-card
                        entity: this.entity_id
                        template: gc2_alarm_action
                        variables:
                          name: Disarm
                          subtitle: Return to standby
                          icon: mdi:shield-off-outline
                          color: var(--warning-color)
                          service: alarm_control_panel.alarm_disarm
                          confirmation: Disarm the security system?
            show_empty: false
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Attention
            heading_style: title
            icon: mdi:shield-alert-outline
          - type: custom:auto-entities
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - integration: gc2_panel
                  domain: binary_sensor
                  state: "on"
                  attributes:
                    zone_type: "*"
                  options:
                    type: custom:button-card
                    template: gc2_attention_zone
                - integration: gc2_panel
                  domain: binary_sensor
                  attributes:
                    zone_type: "*"
                    bypassed: true
                  options:
                    type: custom:button-card
                    template: gc2_attention_zone
                - integration: gc2_panel
                  domain: binary_sensor
                  attributes:
                    zone_type: "*"
                    battery_low: true
                  options:
                    type: custom:button-card
                    template: gc2_attention_zone
                - integration: gc2_panel
                  domain: binary_sensor
                  attributes:
                    zone_type: "*"
                    supervision_lost: true
                  options:
                    type: custom:button-card
                    template: gc2_attention_zone
                - integration: gc2_panel
                  domain: binary_sensor
                  attributes:
                    zone_type: "*"
                    tamper: true
                  options:
                    type: custom:button-card
                    template: gc2_attention_zone
                - integration: gc2_panel
                  domain: binary_sensor
                  state: "on"
                  name: "/(Panel trouble|Panel tamper|Siren tamper|RF jamming|AC power loss|Communication failure|Panel reset required|Latched alarm memory)$/"
                  options:
                    type: custom:button-card
                    template: gc2_panel_alert
            unique: true
            sort:
              method: name
              ignore_case: true
            else:
              type: custom:button-card
              template: gc2_clear
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Panel health
            heading_style: title
            icon: mdi:heart-pulse
          - type: custom:auto-entities
            card:
              type: entities
              show_header_toggle: false
              state_color: true
            filter:
              template: >
                {% set gc2 = integration_entities('gc2_panel') %}
                {% set presets = gc2
                  | select('match', '^select\\.')
                  | select('search', 'chime_and_announcement_volume_preset$')
                  | list %}
                {% if presets %}
                  {{ presets }}
                {% else %}
                  {{ gc2
                    | select('match', '^number\\.')
                    | select('search', 'chime_and_announcement_volume$')
                    | list }}
                {% endif %}
              include:
                - integration: gc2_panel
                  name: "/(Backup battery|Backup battery voltage|Trouble count|Unacknowledged troubles|Command status|UART baud|Debug unlock)$/"
                  options:
                    secondary_info: last-changed
                - integration: gc2_panel
                  domain: binary_sensor
                  name: "/(Panel trouble|Panel tamper|Siren tamper|RF jamming|AC power loss|Communication failure|Panel reset required|Latched alarm memory)$/"
                  options:
                    secondary_info: last-changed
            unique: true
            sort:
              method: name
              ignore_case: true
            show_empty: false
            grid_options:
              columns: full


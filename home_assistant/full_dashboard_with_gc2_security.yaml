                    ${chip('mdi:tshirt-crew', 'Wrinkle', wrinkle, wrinkle === 'On' ? '#20c997' : '#777')}
                    ${chip('mdi:timer-outline', 'Timed', timed, '#4dabf7')}
                    ${chip('mdi:lightbulb-outline', 'Light', light, light === 'On' ? '#ffc107' : '#777')}
                  `;
                ]]]

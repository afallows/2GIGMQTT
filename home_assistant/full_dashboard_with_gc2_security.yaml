                    - color: var(--primary-color)
              - type: custom:button-card
                entity: >-
                  sensor.104120531161003244_bsh_common_option_remainingprogramtime
                name: Finish Time
                show_icon: false
                show_state: false
                show_label: true
                label: |-
                  [[[
                    var raw = entity.state;
                    if (!raw) return "N/A";
                    var finish = new Date(raw);
                    if (isNaN(finish.getTime())) return raw;
                    var now = new Date();
                    var diffMs = finish - now;
                    if (diffMs <= 0) return "Finished";
                    var totalMins = Math.round(diffMs / 60000);
                    var hours = Math.floor(totalMins / 60);
                    var minutes = totalMins % 60;
                    return hours + ":" + String(minutes).padStart(2, "0");
                  ]]]
                styles:
                  card:
                    - padding: 12px
                    - text-align: center
                  name:

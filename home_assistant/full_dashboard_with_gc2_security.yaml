                          const unit = states['sensor.soil_moisture_front_yard']?.attributes?.unit_of_measurement ?? '%';
                          if (isNaN(v)) return '—';
                          return `${v.toFixed(0)} ${unit}`;
                        ]]]
                      styles:
                        card:
                          - background: none
                          - box-shadow: none
                          - border: none
                          - padding: 0
                        grid:
                          - grid-template-areas: '"i" "s"'

                                const unit = states['sensor.soil_moisture_battery_mv_front_yard']?.attributes?.unit_of_measurement ?? 'mV';

                                let mv = NaN;
                                if (!isNaN(raw)) {
                                  mv = unit.toLowerCase() === 'mv' || raw > 20 ? raw : raw * 1000;
                                }

                                if (isNaN(mv)) return 'var(--secondary-text-color)';
                                if (mv < 1300) return 'var(--error-color)';
                                if (mv < 1450) return 'var(--warning-color)';
                                return 'var(--success-color)';
                              ]]]
                        state:
                          - font-size: clamp(8px, 2.1vw, 10px)
                          - font-weight: 600
                          - white-space: nowrap
                          - color: |
                              [[[
                                const raw = parseFloat(states['sensor.soil_moisture_battery_mv_front_yard']?.state);
                                const unit = states['sensor.soil_moisture_battery_mv_front_yard']?.attributes?.unit_of_measurement ?? 'mV';

                                let mv = NaN;
                                if (!isNaN(raw)) {
                                  mv = unit.toLowerCase() === 'mv' || raw > 20 ? raw : raw * 1000;
                                }

                                if (isNaN(mv)) return 'var(--secondary-text-color)';
                                if (mv < 1300) return 'var(--error-color)';
                                if (mv < 1450) return 'var(--warning-color)';
                                return 'var(--success-color)';
